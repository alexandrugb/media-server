networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-media}

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - ${BIND_ADDR:-0.0.0.0}:9696:9696
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9696/ping || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media
