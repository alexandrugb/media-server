networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-media}

services:
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - DELUGE_LOGLEVEL=error
    volumes:
      - ${CONFIG_ROOT}/deluge:/config
      - ${DATA_ROOT}/movies:/data/movies
    ports:
      - ${BIND_ADDR:-0.0.0.0}:8112:8112
      - 6881:6881
      - 6881:6881/udp
      - ${BIND_ADDR:-0.0.0.0}:58846:58846 #optional
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8112 || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media
