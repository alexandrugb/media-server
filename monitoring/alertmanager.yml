## Secrets are read from files under ./secrets/ so nothing lands in git.
## Create them before starting:
##   mkdir -p monitoring/secrets
##   echo -n 'https://discord.com/api/webhooks/...' > monitoring/secrets/discord_url
##   chmod 600 monitoring/secrets/discord_url

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: discord
  routes:
    ## Criticals repeat more often so they are not forgotten.
    - matchers:
        - severity = "critical"
      receiver: discord
      repeat_interval: 2h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}
          {{ end }}{{ end }}

  ## Alternatives, all natively supported. Swap the `receiver:` above to use one.
  ##
  # - name: ntfy
  #   webhook_configs:
  #     - url: https://ntfy.sh/your-private-topic
  #       send_resolved: true
  #
  # - name: slack
  #   slack_configs:
  #     - api_url_file: /etc/alertmanager/secrets/slack_url
  #       channel: '#alerts'
  #       send_resolved: true
  #
  # - name: telegram
  #   telegram_configs:
  #     - bot_token_file: /etc/alertmanager/secrets/telegram_token
  #       chat_id: 123456789
  #       send_resolved: true
  #
  ## Email needs an SMTP relay. Note it cannot fire when the host is down —
  ## that is what the Pulseway agent is for.
  # - name: email
  #   email_configs:
  #     - to: you@example.com
  #       from: alertmanager@example.com
  #       smarthost: smtp.gmail.com:587
  #       auth_username: you@example.com
  #       auth_password_file: /etc/alertmanager/secrets/smtp_password

inhibit_rules:
  - source_matchers: ['severity = critical']
    target_matchers: ['severity = warning']
    equal: ['alertname', 'instance']
