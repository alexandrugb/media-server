global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'radarr'
    metrics_path: /metrics
    static_configs:
      - targets: ['exportarr-radarr:9707']

  - job_name: 'sonarr'
    metrics_path: /metrics
    static_configs:
      - targets: ['exportarr-sonarr:9708']

  - job_name: 'prowlarr'
    metrics_path: /metrics
    static_configs:
      - targets: ['exportarr-prowlarr:9709']
