networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-media}

services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT}/tautulli:/config
      - ${CONFIG_ROOT}/plex/Library/Application Support/Plex Media Server/Logs:/logs:ro
    ports:
      - ${BIND_ADDR:-0.0.0.0}:8181:8181
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8181 || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media
