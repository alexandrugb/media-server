## Single-file monitoring stack for Komodo.
## Paste this into a Komodo Stack (UI Defined) and put the variables from
## monitoring.env.example into the Stack's Environment box.
##
## Every config file is inlined below under the top-level `configs` key, so
## this file is self-contained and needs nothing else on disk.
## Requires Docker Compose v2.23+ for inline config content.

networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-media}

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - ${BIND_ADDR:-0.0.0.0}:9090:9090
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-alert-rules
        target: /etc/prometheus/alert-rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - ${BIND_ADDR:-0.0.0.0}:3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9100']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - promtail-data:/var/lib/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: promtail-config
        target: /etc/promtail/config.yml
    command: ['-config.file=/etc/promtail/config.yml']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9080/metrics']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - ${BIND_ADDR:-0.0.0.0}:9093:9093
    volumes:
      - alertmanager-data:/alertmanager
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9093/-/healthy']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-radarr
    command: ['radarr']
    environment:
      - PORT=9707
      - URL=http://radarr:7878
      - APIKEY=${RADARR_API_KEY:?set RADARR_API_KEY}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9707/healthz']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-sonarr
    command: ['sonarr']
    environment:
      - PORT=9708
      - URL=http://sonarr:8989
      - APIKEY=${SONARR_API_KEY:?set SONARR_API_KEY}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9708/healthz']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-prowlarr
    command: ['prowlarr']
    environment:
      - PORT=9709
      - URL=http://prowlarr:9696
      - APIKEY=${PROWLARR_API_KEY:?set PROWLARR_API_KEY}
      - PROWLARR__BACKFILL=true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9709/healthz']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:
  alertmanager-data:

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files:
        - /etc/prometheus/alert-rules.yml
      alerting:
        alertmanagers:
          - static_configs:
              - targets: ['alertmanager:9093']
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']
        - job_name: 'radarr'
          static_configs:
            - targets: ['exportarr-radarr:9707']
        - job_name: 'sonarr'
          static_configs:
            - targets: ['exportarr-sonarr:9708']
        - job_name: 'prowlarr'
          static_configs:
            - targets: ['exportarr-prowlarr:9709']

  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          uid: prometheus
          url: http://prometheus:9090
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          access: proxy
          uid: loki
          url: http://loki:3100
          editable: false
        - name: Alertmanager
          type: alertmanager
          access: proxy
          uid: alertmanager
          url: http://alertmanager:9093
          jsonData:
            implementation: prometheus
            handleGrafanaManagedAlerts: false
          editable: false

  promtail-config:
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0
      positions:
        filename: /var/lib/promtail/positions.yaml
      clients:
        - url: http://loki:3100/loki/api/v1/push
      scrape_configs:
        - job_name: containers
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 5s
          relabel_configs:
            - source_labels: ['__meta_docker_container_name']
              target_label: 'container'

  alertmanager-config:
    content: |
      route:
        group_by: ['alertname', 'job']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: discord
        routes:
          - matchers:
              - severity = "critical"
            receiver: discord
            repeat_interval: 2h
      receivers:
        - name: discord
          discord_configs:
            - webhook_url: ${DISCORD_WEBHOOK_URL:?set DISCORD_WEBHOOK_URL}
              send_resolved: true
              title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
              message: |-
                {{ range .Alerts }}{{ .Annotations.summary }}
                {{ if .Annotations.description }}{{ .Annotations.description }}
                {{ end }}{{ end }}
      inhibit_rules:
        - source_matchers: ['severity = critical']
          target_matchers: ['severity = warning']
          equal: ['alertname', 'instance']

  prometheus-alert-rules:
    content: |
      groups:
        - name: availability
          rules:
            - alert: TargetDown
              expr: up == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: '{{ $$labels.job }} target is down'
                description: '{{ $$labels.instance }} has been unreachable for 5 minutes.'
        - name: host
          rules:
            - alert: DiskSpaceLow
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 10
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: 'Less than 10% disk left on {{ $$labels.mountpoint }}'
            - alert: DiskSpaceCritical
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 3
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: 'Less than 3% disk left on {{ $$labels.mountpoint }}'
            - alert: HighMemoryUsage
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: 'Host memory above 90% for 15 minutes'
            - alert: HighCpuLoad
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
              for: 20m
              labels:
                severity: warning
              annotations:
                summary: 'Host CPU above 90% for 20 minutes'
        - name: arr
          rules:
            - alert: ArrHealthIssue
              expr: sonarr_system_health_issues > 0 or radarr_system_health_issues > 0 or prowlarr_system_health_issues > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: '{{ $$labels.job }} reports {{ $$value }} health issue(s)'
