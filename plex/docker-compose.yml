networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-media}

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    ports:
      - 32400:32400/tcp
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=http://${PLEX_HOSTNAME}:32400/
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    hostname: ${PLEX_HOSTNAME}
    volumes:
      - ${CONFIG_ROOT}/plex:/config
      - ${DATA_ROOT}:/data:ro
    runtime: nvidia
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:32400/identity || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped
    networks:
      - media
