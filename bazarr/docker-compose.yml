networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-media}

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - ${BIND_ADDR:-0.0.0.0}:6767:6767
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:6767 || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media
