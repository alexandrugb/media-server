networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-media}

services:
  seerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: seerr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT}/seerr:/config
    ports:
      - ${BIND_ADDR:-0.0.0.0}:5055:5055
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:5055/api/v1/status || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - media
