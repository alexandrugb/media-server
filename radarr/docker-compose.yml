networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-media}

services:
  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    ports:
      - ${BIND_ADDR:-0.0.0.0}:7878:7878
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    networks:
      - media
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:7878/ping || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
